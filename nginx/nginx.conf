upstream expense_tracker_backend {
    server backend:5000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://expense_tracker_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://expense_tracker_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://expense_tracker_backend/static/;
        expires 7d;
        add_header Cache-Control "public";
    }
}

# To enable HTTPS with Let's Encrypt on EC2:
#   1. Point a domain's A record at the EC2 public IP
#   2. sudo apt install certbot python3-certbot-nginx
#   3. sudo certbot --nginx -d yourdomain.com
# Certbot will automatically add a 443 server block and redirect HTTP -> HTTPS.
