# Create the real secret with:
#   kubectl create secret generic expense-tracker-secrets \
#     --from-literal=DATABASE_URL=mysql+pymysql://user:pass@rds-endpoint:3306/expense_tracker \
#     --from-literal=SECRET_KEY=your-secret-key \
#     --from-literal=JWT_SECRET_KEY=your-jwt-secret \
#     --from-literal=FLASK_ENV=production
#
# This file is a placeholder/template only — never commit real secrets to git.
apiVersion: v1
kind: Secret
metadata:
  name: expense-tracker-secrets
type: Opaque
stringData:
  DATABASE_URL: "mysql+pymysql://expense_user:CHANGE_ME@your-rds-endpoint:3306/expense_tracker"
  SECRET_KEY: "CHANGE_ME"
  JWT_SECRET_KEY: "CHANGE_ME"
  FLASK_ENV: "production"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: expense-tracker-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - expense-tracker.example.com
      secretName: expense-tracker-tls
  rules:
    - host: expense-tracker.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: expense-tracker-backend-svc
                port:
                  number: 80
