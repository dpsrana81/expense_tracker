<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel · ExpenseFlow</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  {% include "_sidebar.html" %}
  <main class="main-content">
    <div class="topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="mobile-toggle" onclick="toggleSidebar()"><i class="bi bi-list" style="font-size:20px;"></i></button>
        <div>
          <h1>Admin Panel</h1>
          <div class="page-subtitle">Platform-wide statistics and user management</div>
        </div>
      </div>
    </div>

    <div id="accessDenied" class="empty-state d-none"><i class="bi bi-shield-x"></i>You don't have permission to view this page.</div>

    <div id="adminContent" class="d-none">
      <div class="row g-3 mb-3">
        <div class="col-6 col-lg-3">
          <div class="stat-card">
            <div class="stat-icon" style="background:#eef2ff;color:#4f46e5;"><i class="bi bi-people-fill"></i></div>
            <div class="stat-label">Total Users</div>
            <div class="stat-value" id="statUsers">0</div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card">
            <div class="stat-icon" style="background:#fef2f2;color:#dc2626;"><i class="bi bi-receipt"></i></div>
            <div class="stat-label">Total Expenses Logged</div>
            <div class="stat-value" id="statExpenses">0</div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card">
            <div class="stat-icon" style="background:#ecfdf5;color:#059669;"><i class="bi bi-cash-stack"></i></div>
            <div class="stat-label">Total Income Logged</div>
            <div class="stat-value" id="statIncomeAmt">$0</div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card">
            <div class="stat-icon" style="background:#fffbeb;color:#d97706;"><i class="bi bi-wallet2"></i></div>
            <div class="stat-label">Total Expense Volume</div>
            <div class="stat-value" id="statExpenseAmt">$0</div>
          </div>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-lg-7">
          <div class="card-surface">
            <div class="card-surface-title">Registered Users</div>
            <div class="table-responsive">
              <table class="table table-clean mb-0">
                <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead>
                <tbody id="usersTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="card-surface">
            <div class="card-surface-title">Recent Audit Logs</div>
            <div id="auditLogList" style="max-height:480px;overflow-y:auto;"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script>
async function loadStats() {
  const data = await API.get("/api/admin/stats");
  document.getElementById("statUsers").textContent = data.total_users;
  document.getElementById("statExpenses").textContent = data.total_expenses;
  document.getElementById("statIncomeAmt").textContent = formatMoney(data.total_income_amount);
  document.getElementById("statExpenseAmt").textContent = formatMoney(data.total_expense_amount);
}

async function loadUsers() {
  const data = await API.get("/api/admin/users");
  document.getElementById("usersTableBody").innerHTML = data.items.map(u => `
    <tr>
      <td class="fw-semibold">${u.full_name}</td>
      <td class="text-muted">${u.email}</td>
      <td><span class="badge-soft ${u.role === 'admin' ? 'info' : 'neutral'}">${u.role}</span></td>
      <td><span class="badge-soft ${u.is_active !== false ? 'success' : 'danger'}">${u.is_active !== false ? 'Active' : 'Disabled'}</span></td>
      <td><button class="btn btn-sm btn-outline-secondary" onclick="toggleUser('${u.id}')">Toggle Status</button></td>
    </tr>`).join("");
}

async function toggleUser(id) {
  try {
    await API.put(`/api/admin/users/${id}/toggle-active`);
    showToast("User status updated");
    loadUsers();
  } catch (err) { showToast(err.message, "danger"); }
}

async function loadAuditLogs() {
  const data = await API.get("/api/admin/audit-logs?per_page=20");
  document.getElementById("auditLogList").innerHTML = data.items.map(a => `
    <div class="d-flex justify-content-between align-items-start py-2" style="border-bottom:1px solid var(--gray-100);font-size:13px;">
      <div>
        <div class="fw-semibold">${a.action.replace(/_/g, " ")}</div>
        <div class="text-muted" style="font-size:12px;">${a.details || ""}</div>
      </div>
      <div class="text-muted" style="font-size:11.5px;white-space:nowrap;">${new Date(a.created_at).toLocaleString()}</div>
    </div>`).join("") || `<div class="empty-state py-4"><i class="bi bi-clock-history"></i>No activity yet</div>`;
}

(async () => {
  const user = await requireAuth();
  if (!user) return;
  initShell(user);
  if (user.role !== "admin") {
    document.getElementById("accessDenied").classList.remove("d-none");
    return;
  }
  document.getElementById("adminContent").classList.remove("d-none");
  try {
    await Promise.all([loadStats(), loadUsers(), loadAuditLogs()]);
  } catch (err) { showToast(err.message, "danger"); }
})();
</script>
</body>
</html>
