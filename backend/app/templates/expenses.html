<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expenses · ExpenseFlow</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  {% include "_sidebar.html" %}
  <main class="main-content">
    <div class="topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="mobile-toggle" onclick="toggleSidebar()"><i class="bi bi-list" style="font-size:20px;"></i></button>
        <div>
          <h1>Expenses</h1>
          <div class="page-subtitle">Track and manage every expense</div>
        </div>
      </div>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#expenseModal" onclick="openCreateModal()">
        <i class="bi bi-plus-lg me-1"></i> Add Expense
      </button>
    </div>

    <div class="card-surface mb-3">
      <div class="row g-2">
        <div class="col-md-3">
          <input type="text" class="form-control" id="searchInput" placeholder="Search expenses...">
        </div>
        <div class="col-md-3">
          <select class="form-select" id="filterCategory"><option value="">All categories</option></select>
        </div>
        <div class="col-md-2">
          <select class="form-select" id="filterMonth"><option value="">All months</option></select>
        </div>
        <div class="col-md-2">
          <select class="form-select" id="filterYear"><option value="">All years</option></select>
        </div>
        <div class="col-md-2">
          <button class="btn btn-outline-secondary w-100" onclick="resetFilters()"><i class="bi bi-arrow-counterclockwise me-1"></i>Reset</button>
        </div>
      </div>
    </div>

    <div class="card-surface">
      <div class="table-responsive">
        <table class="table table-clean mb-0">
          <thead><tr><th>Title</th><th>Category</th><th>Date</th><th>Payment</th><th class="text-end">Amount</th><th></th></tr></thead>
          <tbody id="expenseTableBody"></tbody>
        </table>
      </div>
      <nav class="mt-3"><ul class="pagination justify-content-center mb-0" id="pagination"></ul></nav>
    </div>
  </main>
</div>

<!-- Expense Modal -->
<div class="modal fade" id="expenseModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Add Expense</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="expenseForm">
        <div class="modal-body">
          <input type="hidden" id="expenseId">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" class="form-control" id="title" required placeholder="e.g. Grocery shopping">
          </div>
          <div class="row g-3">
            <div class="col-6">
              <label class="form-label">Amount</label>
              <input type="number" step="0.01" min="0.01" class="form-control" id="amount" required>
            </div>
            <div class="col-6">
              <label class="form-label">Date</label>
              <input type="date" class="form-control" id="expenseDate" required>
            </div>
          </div>
          <div class="row g-3 mt-0">
            <div class="col-6">
              <label class="form-label">Category</label>
              <select class="form-select" id="categorySelect"></select>
            </div>
            <div class="col-6">
              <label class="form-label">Payment Method</label>
              <select class="form-select" id="paymentMethod">
                <option>Cash</option><option>Credit Card</option><option>Debit Card</option><option>Bank Transfer</option><option>UPI</option><option>Other</option>
              </select>
            </div>
          </div>
          <div class="mb-0 mt-3">
            <label class="form-label">Notes (optional)</label>
            <textarea class="form-control" id="notes" rows="2"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Expense</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script>
let currentPage = 1;
let categories = [];
let expenseModal;

function populateFilters() {
  const monthSel = document.getElementById("filterMonth");
  for (let m = 1; m <= 12; m++) {
    const opt = document.createElement("option"); opt.value = m; opt.textContent = monthName(m);
    monthSel.appendChild(opt);
  }
  const yearSel = document.getElementById("filterYear");
  const currentYear = new Date().getFullYear();
  for (let y = currentYear - 2; y <= currentYear + 1; y++) {
    const opt = document.createElement("option"); opt.value = y; opt.textContent = y;
    yearSel.appendChild(opt);
  }
  document.getElementById("searchInput").addEventListener("input", debounce(() => { currentPage = 1; loadExpenses(); }, 350));
  ["filterCategory", "filterMonth", "filterYear"].forEach(id =>
    document.getElementById(id).addEventListener("change", () => { currentPage = 1; loadExpenses(); }));
}

function debounce(fn, delay) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };
}

function resetFilters() {
  document.getElementById("searchInput").value = "";
  document.getElementById("filterCategory").value = "";
  document.getElementById("filterMonth").value = "";
  document.getElementById("filterYear").value = "";
  currentPage = 1;
  loadExpenses();
}

async function loadCategories() {
  const data = await API.get("/api/categories?type=expense");
  categories = data.items;
  const filterSel = document.getElementById("filterCategory");
  const formSel = document.getElementById("categorySelect");
  filterSel.innerHTML = '<option value="">All categories</option>' + categories.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
  formSel.innerHTML = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
}

async function loadExpenses() {
  const params = new URLSearchParams();
  params.set("page", currentPage);
  const search = document.getElementById("searchInput").value;
  const cat = document.getElementById("filterCategory").value;
  const month = document.getElementById("filterMonth").value;
  const year = document.getElementById("filterYear").value;
  if (search) params.set("search", search);
  if (cat) params.set("category_id", cat);
  if (month) params.set("month", month);
  if (year) params.set("year", year);

  try {
    const data = await API.get(`/api/expenses?${params.toString()}`);
    renderTable(data.items);
    renderPagination(data.page, data.pages);
  } catch (err) {
    showToast(err.message, "danger");
  }
}

function renderTable(items) {
  const tbody = document.getElementById("expenseTableBody");
  if (!items.length) {
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><i class="bi bi-receipt"></i>No expenses found</div></td></tr>`;
    return;
  }
  tbody.innerHTML = items.map(e => `
    <tr>
      <td class="fw-semibold">${e.title}${e.notes ? `<div class="text-muted" style="font-size:12px;">${e.notes}</div>` : ""}</td>
      <td>${e.category ? `<span class="category-pill" style="background:${e.category.color}1a;color:${e.category.color};"><i class="bi ${e.category.icon}"></i> ${e.category.name}</span>` : '<span class="text-muted">Uncategorized</span>'}</td>
      <td class="text-muted">${formatDate(e.expense_date)}</td>
      <td><span class="badge-soft neutral">${e.payment_method || "—"}</span></td>
      <td class="text-end fw-semibold">${formatMoney(e.amount)}</td>
      <td>
        <div class="d-flex gap-1 justify-content-end">
          <button class="btn-icon" onclick='editExpense(${JSON.stringify(e)})'><i class="bi bi-pencil"></i></button>
          <button class="btn-icon danger" onclick="deleteExpense('${e.id}')"><i class="bi bi-trash"></i></button>
        </div>
      </td>
    </tr>`).join("");
}

function renderPagination(page, pages) {
  const el = document.getElementById("pagination");
  if (pages <= 1) { el.innerHTML = ""; return; }
  let html = "";
  for (let p = 1; p <= pages; p++) {
    html += `<li class="page-item ${p === page ? "active" : ""}"><button class="page-link" onclick="goToPage(${p})">${p}</button></li>`;
  }
  el.innerHTML = html;
}

function goToPage(p) { currentPage = p; loadExpenses(); }

function openCreateModal() {
  document.getElementById("modalTitle").textContent = "Add Expense";
  document.getElementById("expenseForm").reset();
  document.getElementById("expenseId").value = "";
  document.getElementById("expenseDate").value = new Date().toISOString().split("T")[0];
}

function editExpense(e) {
  document.getElementById("modalTitle").textContent = "Edit Expense";
  document.getElementById("expenseId").value = e.id;
  document.getElementById("title").value = e.title;
  document.getElementById("amount").value = e.amount;
  document.getElementById("expenseDate").value = e.expense_date;
  document.getElementById("categorySelect").value = e.category ? e.category.id : "";
  document.getElementById("paymentMethod").value = e.payment_method || "Cash";
  document.getElementById("notes").value = e.notes || "";
  expenseModal.show();
}

async function deleteExpense(id) {
  if (!confirm("Delete this expense? This cannot be undone.")) return;
  try {
    await API.del(`/api/expenses/${id}`);
    showToast("Expense deleted");
    loadExpenses();
  } catch (err) { showToast(err.message, "danger"); }
}

document.getElementById("expenseForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const id = document.getElementById("expenseId").value;
  const payload = {
    title: document.getElementById("title").value.trim(),
    amount: parseFloat(document.getElementById("amount").value),
    expense_date: document.getElementById("expenseDate").value,
    category_id: document.getElementById("categorySelect").value || null,
    payment_method: document.getElementById("paymentMethod").value,
    notes: document.getElementById("notes").value.trim(),
  };
  try {
    if (id) {
      await API.put(`/api/expenses/${id}`, payload);
      showToast("Expense updated");
    } else {
      await API.post("/api/expenses", payload);
      showToast("Expense added");
    }
    expenseModal.hide();
    loadExpenses();
  } catch (err) { showToast(err.message, "danger"); }
});

(async () => {
  const user = await requireAuth();
  if (!user) return;
  initShell(user);
  expenseModal = new bootstrap.Modal(document.getElementById("expenseModal"));
  populateFilters();
  await loadCategories();
  loadExpenses();
})();
</script>
</body>
</html>
