<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Income · ExpenseFlow</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  {% include "_sidebar.html" %}
  <main class="main-content">
    <div class="topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="mobile-toggle" onclick="toggleSidebar()"><i class="bi bi-list" style="font-size:20px;"></i></button>
        <div>
          <h1>Income</h1>
          <div class="page-subtitle">Track all of your income sources</div>
        </div>
      </div>
      <button class="btn btn-primary" onclick="openCreateModal()"><i class="bi bi-plus-lg me-1"></i> Add Income</button>
    </div>

    <div class="card-surface">
      <div class="table-responsive">
        <table class="table table-clean mb-0">
          <thead><tr><th>Source</th><th>Category</th><th>Date</th><th class="text-end">Amount</th><th></th></tr></thead>
          <tbody id="incomeTableBody"></tbody>
        </table>
      </div>
      <nav class="mt-3"><ul class="pagination justify-content-center mb-0" id="pagination"></ul></nav>
    </div>
  </main>
</div>

<div class="modal fade" id="incomeModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Add Income</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="incomeForm">
        <div class="modal-body">
          <input type="hidden" id="incomeId">
          <div class="mb-3">
            <label class="form-label">Source</label>
            <input type="text" class="form-control" id="source" required placeholder="e.g. Monthly Salary">
          </div>
          <div class="row g-3">
            <div class="col-6">
              <label class="form-label">Amount</label>
              <input type="number" step="0.01" min="0.01" class="form-control" id="amount" required>
            </div>
            <div class="col-6">
              <label class="form-label">Date</label>
              <input type="date" class="form-control" id="incomeDate" required>
            </div>
          </div>
          <div class="mb-0 mt-3">
            <label class="form-label">Category</label>
            <select class="form-select" id="categorySelect"></select>
          </div>
          <div class="mb-0 mt-3">
            <label class="form-label">Notes (optional)</label>
            <textarea class="form-control" id="notes" rows="2"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Income</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script>
let currentPage = 1;
let incomeModal;

async function loadCategories() {
  const data = await API.get("/api/categories?type=income");
  document.getElementById("categorySelect").innerHTML = data.items.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
}

async function loadIncome() {
  try {
    const data = await API.get(`/api/income?page=${currentPage}`);
    renderTable(data.items);
    renderPagination(data.page, data.pages);
  } catch (err) { showToast(err.message, "danger"); }
}

function renderTable(items) {
  const tbody = document.getElementById("incomeTableBody");
  if (!items.length) {
    tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><i class="bi bi-cash-coin"></i>No income recorded yet</div></td></tr>`;
    return;
  }
  tbody.innerHTML = items.map(i => `
    <tr>
      <td class="fw-semibold">${i.source}${i.notes ? `<div class="text-muted" style="font-size:12px;">${i.notes}</div>` : ""}</td>
      <td>${i.category ? `<span class="category-pill" style="background:${i.category.color}1a;color:${i.category.color};"><i class="bi ${i.category.icon}"></i> ${i.category.name}</span>` : '<span class="text-muted">—</span>'}</td>
      <td class="text-muted">${formatDate(i.income_date)}</td>
      <td class="text-end fw-semibold text-success">+${formatMoney(i.amount)}</td>
      <td>
        <div class="d-flex gap-1 justify-content-end">
          <button class="btn-icon" onclick='editIncome(${JSON.stringify(i)})'><i class="bi bi-pencil"></i></button>
          <button class="btn-icon danger" onclick="deleteIncome('${i.id}')"><i class="bi bi-trash"></i></button>
        </div>
      </td>
    </tr>`).join("");
}

function renderPagination(page, pages) {
  const el = document.getElementById("pagination");
  if (pages <= 1) { el.innerHTML = ""; return; }
  let html = "";
  for (let p = 1; p <= pages; p++) {
    html += `<li class="page-item ${p === page ? "active" : ""}"><button class="page-link" onclick="goToPage(${p})">${p}</button></li>`;
  }
  el.innerHTML = html;
}
function goToPage(p) { currentPage = p; loadIncome(); }

function openCreateModal() {
  document.getElementById("modalTitle").textContent = "Add Income";
  document.getElementById("incomeForm").reset();
  document.getElementById("incomeId").value = "";
  document.getElementById("incomeDate").value = new Date().toISOString().split("T")[0];
  incomeModal.show();
}

function editIncome(i) {
  document.getElementById("modalTitle").textContent = "Edit Income";
  document.getElementById("incomeId").value = i.id;
  document.getElementById("source").value = i.source;
  document.getElementById("amount").value = i.amount;
  document.getElementById("incomeDate").value = i.income_date;
  document.getElementById("categorySelect").value = i.category ? i.category.id : "";
  document.getElementById("notes").value = i.notes || "";
  incomeModal.show();
}

async function deleteIncome(id) {
  if (!confirm("Delete this income entry?")) return;
  try {
    await API.del(`/api/income/${id}`);
    showToast("Income deleted");
    loadIncome();
  } catch (err) { showToast(err.message, "danger"); }
}

document.getElementById("incomeForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const id = document.getElementById("incomeId").value;
  const payload = {
    source: document.getElementById("source").value.trim(),
    amount: parseFloat(document.getElementById("amount").value),
    income_date: document.getElementById("incomeDate").value,
    category_id: document.getElementById("categorySelect").value || null,
    notes: document.getElementById("notes").value.trim(),
  };
  try {
    if (id) { await API.put(`/api/income/${id}`, payload); showToast("Income updated"); }
    else { await API.post("/api/income", payload); showToast("Income added"); }
    incomeModal.hide();
    loadIncome();
  } catch (err) { showToast(err.message, "danger"); }
});

(async () => {
  const user = await requireAuth();
  if (!user) return;
  initShell(user);
  incomeModal = new bootstrap.Modal(document.getElementById("incomeModal"));
  await loadCategories();
  loadIncome();
})();
</script>
</body>
</html>
